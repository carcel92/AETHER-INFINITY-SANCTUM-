# docker-compose.yml	

version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flamma_backend
    ports:
      - ""8000:8000""
    volumes:
      - E:/MyCodeWorld/MODELS:/models:ro
      - ./backend:/app
    environment:
      - MODELS_PATH=/models
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flamma_frontend
    ports:
      - ""3000:3000""
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    restart: unless-stopped																								